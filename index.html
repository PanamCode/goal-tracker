<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Цель — Трекер Мечт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-mesh"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <canvas id="confetti"></canvas>

  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
        </div>
        Цель
      </div>
      <div class="stats-pill">
        <div><span>Всего</span> <strong id="stat-total">0</strong></div>
        <div><span>Готово</span> <strong id="stat-done">0</strong></div>
        <div><span>В процессе</span> <strong id="stat-active">0</strong></div>
      </div>
    </header>

    <section class="hero">
      <div class="hero-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        Преврати мечты в реальность
      </div>
      <h1>Твой личный<br><span class="gradient">трекер целей</span></h1>
      <p>Ставь амбициозные цели, отмечай прогресс и смотри, как мечты становятся достижениями</p>

      <div class="progress-overview">
        <div class="progress-card">
          <div class="ring-wrap">
            <svg viewBox="0 0 90 90">
              <defs>
                <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#7c5cff"/>
                  <stop offset="50%" stop-color="#00d4ff"/>
                  <stop offset="100%" stop-color="#ff4d8d"/>
                </linearGradient>
              </defs>
              <circle class="ring-bg" cx="45" cy="45" r="40"/>
              <circle class="ring-progress" id="progress-ring" cx="45" cy="45" r="40"/>
            </svg>
            <div class="ring-text" id="progress-percent">0%</div>
          </div>
          <div class="progress-info">
            <h3>Общий прогресс</h3>
            <p id="progress-label">Начни добавлять цели</p>
          </div>
        </div>
      </div>
    </section>

    <section class="add-section">
      <form class="add-form" id="add-form">
        <input type="text" id="goal-input" placeholder="Что хочешь достичь? Например: Выучить испанский..." autocomplete="off" maxlength="120">
        <button type="submit" class="add-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Добавить
        </button>
      </form>
    </section>

    <div class="goals-header">
      <h2>Мои цели</h2>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">Все</button>
        <button class="filter-tab" data-filter="active">В процессе</button>
        <button class="filter-tab" data-filter="done">Готово</button>
      </div>
    </div>

    <div class="goals-grid" id="goals-grid"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
